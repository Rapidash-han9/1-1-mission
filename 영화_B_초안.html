<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>영화 티어리스트</title>
  <style>
    :root{
      --bg: #ffffff;
      --card: #f6f7fb;
      --accent: #3b82f6;
      --muted: #6b7280;
      --border: #e5e7eb;
    }
    html,body{
      height:100%;
      margin:0;
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      background:var(--bg);
      color:#111827;
    }
    .app{
      max-width:1100px;
      margin:24px auto;
      padding:20px;
      box-sizing:border-box;
    }
    header{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:14px;
    }
    h1{
      font-size:20px;
      margin:0;
    }
    .controls{
      margin-top:8px;
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }
    input[type="text"]{
      padding:8px 10px;
      border:1px solid var(--border);
      border-radius:6px;
      width:320px;
      box-sizing:border-box;
    }
    button{
      padding:8px 12px;
      border-radius:6px;
      border:1px solid var(--border);
      background:#fff;
      cursor:pointer;
    }
    button.primary{
      background:var(--accent);
      color:#fff;
      border-color:transparent;
    }
    .layout{
      display:flex;
      flex-direction:column;
      gap:14px;
      margin-top:18px;
    }
    .tiers{
      display:flex;
      gap:12px;
      align-items:flex-start;
    }
    .tier{
      flex:1;
      min-height:140px;
      background:#fff;
      border:1px dashed var(--border);
      border-radius:8px;
      padding:10px;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .tier-header{
      font-weight:600;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      font-size:14px;
    }
    .dropzone{
      flex:1;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-content:flex-start;
      padding-top:6px;
    }
    .movie{
      background:var(--card);
      padding:8px 10px;
      border-radius:8px;
      border:1px solid var(--border);
      cursor:grab;
      user-select:none;
      font-size:13px;
      max-width:120px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .movie:active{ cursor:grabbing; }
    .dropzone.dragover{
      outline:3px dashed rgba(59,130,246,0.18);
      border-radius:8px;
    }
    .library{
      margin-top:18px;
      background:#fff;
      border:1px dashed var(--border);
      border-radius:8px;
      padding:10px;
      box-sizing:border-box;
      min-height:90px;
    }
    .library-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-weight:600;
      margin-bottom:8px;
    }
    .footer-note{
      margin-top:10px;
      color:var(--muted);
      font-size:13px;
    }
    @media(max-width:900px){
      .tiers{ flex-direction:column; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>영화 티어리스트</h1>
    </header>

    <div class="controls">
      <input id="movie-input" type="text" placeholder="영화 제목을 입력하세요 (예: 기생충)" />
      <button id="add-btn" class="primary">추가</button>
      <button id="save-img">이미지 저장</button>
      <button id="copy-link">링크 복사</button>
      <button id="reset-btn">초기화 (기본 리스트로)</button>
    </div>

    <div class="layout">
      <div id="tier-board">
        <div class="tiers">
          <div class="tier">
            <div class="tier-header"><span>S</span><small class="muted">최고</small></div>
            <div class="dropzone" data-zone="S"></div>
          </div>
          <div class="tier">
            <div class="tier-header"><span>A</span></div>
            <div class="dropzone" data-zone="A"></div>
          </div>
          <div class="tier">
            <div class="tier-header"><span>B</span></div>
            <div class="dropzone" data-zone="B"></div>
          </div>
          <div class="tier">
            <div class="tier-header"><span>C</span></div>
            <div class="dropzone" data-zone="C"></div>
          </div>
          <div class="tier">
            <div class="tier-header"><span>D</span></div>
            <div class="dropzone" data-zone="D"></div>
          </div>
        </div>

        <div class="library" style="margin-top:14px;">
          <div class="library-header">
            <div>보관함</div>
            <div style="font-size:13px;color:var(--muted)">드래그하여 등급에 배치하세요</div>
          </div>
          <div id="library" class="dropzone" data-zone="library"></div>
        </div>
      </div>

      <div class="footer-note">
        - 영화 항목을 클릭하여 드래그하세요. 링크 복사는 현재 상태를 URL로 인코딩합니다.
      </div>
    </div>
  </div>

  <!-- html2canvas (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    (function(){
      // 기본 영화 8편 (요청하신 리스트)
      const DEFAULT_MOVIES = [
        "기생충",
        "인터스텔라",
        "라라랜드",
        "센과 치히로의 행방불명",
        "어벤져스: 엔드게임",
        "범죄도시",
        "타이타닉",
        "토이 스토리"
      ];

      const input = document.getElementById('movie-input');
      const addBtn = document.getElementById('add-btn');
      const saveImgBtn = document.getElementById('save-img');
      const copyLinkBtn = document.getElementById('copy-link');
      const resetBtn = document.getElementById('reset-btn');

      const dropzones = document.querySelectorAll('.dropzone');
      const library = document.getElementById('library');
      const board = document.getElementById('tier-board');

      let idCounter = Date.now() % 100000;

      function genId(){
        idCounter += 1;
        return 'm' + idCounter;
      }

      // 영화 엘리먼트 생성
      function createMovieElement(movie){
        const el = document.createElement('div');
        el.className = 'movie';
        el.textContent = movie.title;
        el.draggable = true;
        el.dataset.id = movie.id;
        el.dataset.title = movie.title;

        el.addEventListener('dragstart', function(e){
          e.dataTransfer.setData('text/plain', movie.id);
          e.dataTransfer.effectAllowed = 'move';
          // small visual feedback
          setTimeout(()=> el.style.opacity = '0.6', 20);
        });
        el.addEventListener('dragend', function(){
          el.style.opacity = '';
        });

        return el;
      }

      // 현재 상태를 기반으로 화면에 렌더링
      function renderFromState(state){
        // 비우기
        dropzones.forEach(z => z.innerHTML = '');
        state.forEach(m => {
          const zone = document.querySelector('.dropzone[data-zone="'+m.zone+'"]');
          const el = createMovieElement(m);
          if (zone) zone.appendChild(el);
          else library.appendChild(el); // 안전장치
        });
      }

      // 현재 DOM 상태를 객체로 반환
      function collectState(){
        const movies = [];
        document.querySelectorAll('.dropzone').forEach(z => {
          const zoneName = z.dataset.zone;
          Array.from(z.children).forEach(child => {
            movies.push({
              id: child.dataset.id,
              title: child.dataset.title,
              zone: zoneName
            });
          });
        });
        return movies;
      }

      // URL로 상태 저장/복원
      function makeShareUrl(){
        const state = collectState();
        const encoded = encodeURIComponent(JSON.stringify(state));
        return location.origin + location.pathname + '?data=' + encoded;
      }

      function tryLoadFromUrl(){
        const params = new URLSearchParams(location.search);
        const d = params.get('data');
        if (!d) return null;
        try{
          const parsed = JSON.parse(decodeURIComponent(d));
          if (!Array.isArray(parsed)) return null;
          return parsed.map(item => ({
            id: item.id || genId(),
            title: String(item.title || ''),
            zone: String(item.zone || 'library')
          }));
        }catch(e){
          console.warn('URL 데이터 파싱 실패', e);
          return null;
        }
      }

      // 기본 상태 생성 (모든 영화를 보관함에)
      function defaultState(){
        return DEFAULT_MOVIES.map(t => ({ id: genId(), title: t, zone: 'library' }));
      }

      // 초기 로드: URL 있으면 복원, 아니면 기본 리스트
      const urlState = tryLoadFromUrl();
      if (urlState){
        renderFromState(urlState);
      } else {
        renderFromState(defaultState());
      }

      // 드래그 앤 드롭 핸들
      dropzones.forEach(z => {
        z.addEventListener('dragover', function(e){
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          z.classList.add('dragover');
        });
        z.addEventListener('dragleave', function(){
          z.classList.remove('dragover');
        });
        z.addEventListener('drop', function(e){
          e.preventDefault();
          z.classList.remove('dragover');
          const id = e.dataTransfer.getData('text/plain');
          if (!id) return;
          const dragged = document.querySelector('.movie[data-id="'+id+'"]');
          if (dragged){
            z.appendChild(dragged);
          }
        });
      });

      // 영화 추가
      function addMovie(title){
        title = String(title || '').trim();
        if (!title) return;
        const movie = { id: genId(), title: title, zone: 'library' };
        const el = createMovieElement(movie);
        library.appendChild(el);
        input.value = '';
        input.focus();
      }

      addBtn.addEventListener('click', function(){
        addMovie(input.value);
      });
      input.addEventListener('keydown', function(e){
        if (e.key === 'Enter') addMovie(input.value);
      });

      // 이미지 저장 (html2canvas 사용)
      saveImgBtn.addEventListener('click', function(){
        // 잠깐 버튼 비활성화
        saveImgBtn.disabled = true;
        html2canvas(board, { scale: 2, backgroundColor: null }).then(canvas => {
          canvas.toBlob(function(blob){
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tierlist.png';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            saveImgBtn.disabled = false;
          }, 'image/png');
        }).catch(err => {
          console.error(err);
          alert('이미지 저장 중 오류가 발생했습니다.');
          saveImgBtn.disabled = false;
        });
      });

      // 링크 복사
      copyLinkBtn.addEventListener('click', function(){
        const url = makeShareUrl();
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(url).then(()=> {
            alert('링크가 클립보드에 복사되었습니다. 붙여넣어 공유하세요.');
          }).catch(err => {
            console.warn('clipboard write failed', err);
            fallbackCopy(url);
          });
        } else {
          fallbackCopy(url);
        }
      });

      function fallbackCopy(text){
        // 구형 브라우저용 대체: prompt로 보여줌
        window.prompt('이 링크를 복사하세요 (Ctrl+C):', text);
      }

      // 초기화: 기본 리스트로 되돌리기 (URL 파라미터 제거)
      resetBtn.addEventListener('click', function(){
        if (!confirm('기본 영화 리스트(요청하신 8편)로 초기화하시겠습니까? 현재 상태는 삭제됩니다.')) return;
        history.replaceState(null, '', location.pathname);
        renderFromState(defaultState());
      });

      // 페이지가 로드될 때 이미지 저장을 위한 html2canvas 준비는 CDN 로드 완료로 처리됨.
      // 추가 설명: 사용자가 링크를 생성하면 ?data=... 형태로 상태를 인코딩합니다.
      // 같은 링크로 접속하면 원래의 영화/배치가 복원됩니다.

      // 친절한 포커스 처리
      input.focus();

    })();
  </script>
</body>
</html>
